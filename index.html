<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro RPG Qix</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-layout">
        <div class="game-area-container">
            <canvas id="gameCanvas" width="640" height="480"></canvas>
            <div id="trail-gauge-container">
                <div id="trail-gauge-fill" style="width: 100%;"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel portrait-panel">
                <div class="portrait-frame">
                    <div class="portrait-placeholder">HERO</div>
                </div>
                <div class="name-tag">ALEX</div>
                <button id="settings-btn" class="retro-btn">CONFIG</button>
            </div>

            <div class="panel status-panel">
                <div class="panel-title">STATUS</div>
                <div class="stat-row">LVL <span id="level-val">1</span></div>

                <div class="stat-group">
                    <div class="stat-label">HP</div>
                    <div class="bar-border">
                        <div id="hp-bar-fill" class="bar-inner hp-fill" style="width: 100%;"></div>
                    </div>
                </div>

                <div class="stat-group">
                    <div class="stat-label">XP</div>
                    <div class="bar-border">
                        <div id="xp-bar-fill" class="bar-inner xp-fill" style="width: 0%;"></div>
                    </div>
                </div>

                <div class="stat-row">ATK <span id="atk-val">10</span></div>
                <div class="stat-row">DEF <span id="def-val">5</span></div>
            </div>

            <div class="panel inventory-panel">
                <div class="panel-title">INVENTORY</div>
                <div id="inventory-list">
                    <!-- Items go here -->
                </div>
            </div>

            <div class="panel log-panel">
                <div class="panel-title">SYSTEM LOG</div>
                <div id="game-log">
                    <div class="log-entry">Welcome to the dungeon...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="hidden">
        <div class="settings-panel">
            <div class="panel-title">GAME CONFIG</div>

            <div class="setting-group">
                <label>Enemy Count: <span id="val-enemy-count"></span></label>
                <input type="range" id="cfg-enemy-count" min="0" max="100" step="1">
            </div>

            <div class="setting-group">
                <label>Spawn Rate (ms): <span id="val-spawn-rate"></span></label>
                <input type="range" id="cfg-spawn-rate" min="100" max="5000" step="100">
            </div>

            <div class="setting-group">
                <label>Enemy Speed: <span id="val-enemy-speed"></span></label>
                <input type="range" id="cfg-enemy-speed" min="10" max="500" step="10">
            </div>

            <hr>

            <div class="setting-group">
                <label>Player Base Speed (ms): <span id="val-player-speed"></span></label>
                <input type="range" id="cfg-player-speed" min="10" max="200" step="5">
            </div>

            <div class="setting-group">
                <label>Speed Growth: <span id="val-speed-growth"></span></label>
                <input type="range" id="cfg-speed-growth" min="0" max="100" step="1">
            </div>

            <hr>

            <div class="setting-group">
                <label>Base Trail Limit: <span id="val-trail-limit"></span></label>
                <input type="range" id="cfg-trail-limit" min="5" max="100" step="1">
            </div>

            <div class="setting-group">
                <label>Trail Growth: <span id="val-trail-growth"></span></label>
                <input type="range" id="cfg-trail-growth" min="0" max="50" step="1">
            </div>

            <div class="button-row">
                <button id="apply-btn" class="retro-btn">RESTART GAME</button>
                <button id="close-settings-btn" class="retro-btn">CLOSE</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
